apiVersion: nvidia.com/v1alpha1
kind: DynamoGraphDeployment
metadata:
  name: dynamo-agg
  namespace: dynamo
spec:
  services:
    Frontend:
      envFromSecret: hf-token-secret
      componentType: frontend
      replicas: 1
      extraPodSpec:
        nodeSelector:
          nvidia.com/gpu.product: NVIDIA-H100-SXM5-80GB
        mainContainer:
          image: nvcr.io/nvidia/ai-dynamo/vllm-runtime:1.3.0
          imagePullPolicy: IfNotPresent
          command:
          - python3
          - -m
          - dynamo.frontend
          args:
          - --http-port
          - '8000'
    VllmWorker:
      envFromSecret: hf-token-secret
      componentType: worker
      replicas: 1
      resources:
        limits:
          gpu: '1'
      sharedMemory:
        size: 64Gi
      extraPodSpec:
        nodeSelector:
          nvidia.com/gpu.product: NVIDIA-H100-SXM5-80GB
        mainContainer:
          image: nvcr.io/nvidia/ai-dynamo/vllm-runtime:1.3.0
          workingDir: /workspace/examples/backends/vllm
          imagePullPolicy: IfNotPresent
          command:
          - python3
          - -m
          - dynamo.vllm
          args:
          - --model
          - Qwen/Qwen3.5-4B
          - --served-model-name
          - Qwen/Qwen3.5-4B
          - --tensor-parallel-size
          - '1'
          - --pipeline-parallel-size
          - '1'
          - --data-parallel-size
          - '1'
          - --kv-cache-dtype
          - auto
          - --max-model-len
          - '2140'
          - --max-num-seqs
          - '512'
          - --max-num-batched-tokens
          - '2524'
          env:
          - name: NCCL_CUMEM_ENABLE
            value: '1'
