                        React.createElement('span', { key: 't', className: 'text-sm' }, label)
                    ])
                )))
            ]);
        }

        function SidebarFooter({ total }) {
            return React.createElement('div', { className: 'mt-auto flex flex-wrap gap-2 text-slate-400 text-xs' }, [
                React.createElement('div', { key: 'm', className: 'px-3 py-1 rounded-full bg-[#111827] border border-slate-700 text-slate-300' }, `Total Tests: ${total}`)
            ]);
        }

        function DataTable({ dataset, onlyPareto = false, xAxis, yAxis, selectedPoint }) {
            const filtered = useMemo(() => {
                if (!onlyPareto) return dataset;
                // recompute pareto based on current axes
                if (!dataset || dataset.length === 0) return [];
                const pts = dataset.map(d => ({
                    x: d[xAxis],
                    y: d[yAxis],
                    original: d
                }));
                const p = getParetoPoints(pts);
                const set = new Set(p.map(i => i.original));
                return dataset.filter(d => set.has(d));
            }, [dataset, onlyPareto, xAxis, yAxis]);

            // Filter and order fields for display - check if any row has data for each field
            const orderedFields = useMemo(() => {
                const fieldOrder = ['framework', 'cmd', 'max_concurrency', 'request_rate'];

                const normalizedFields = new Set();
                filtered.forEach(item => {
                    const original = item._original || item;
                    Object.keys(original.config?.normalized_config || {}).forEach(key => normalizedFields.add(key));
                });

                // Add all server args dynamically
                const serverArgFields = new Set();
                filtered.forEach(item => {
                    const original = item._original || item;
                    Object.keys(original.config?.server_args || {}).forEach(key => serverArgFields.add(key));
                });

                const allPossibleFields = [...new Set([...fieldOrder, ...normalizedFields, ...serverArgFields])];

                // Only include fields that have data in at least one row
                return allPossibleFields.filter(field => {
                    return filtered.some(row => {
                        const value = getNestedValue(row._original || row, field);
                        return value !== undefined && value !== null && value !== '';
                    });
                });
            }, [filtered]);

            // Sort rows by x-axis value (dataset already uses 1/x when needed)
            const sortedRows = useMemo(() => {
                const copy = [...filtered];
                copy.sort((a, b) => {
                    const ax = Number(a?.[xAxis] ?? 0);
                    const bx = Number(b?.[xAxis] ?? 0);
                    return ax - bx; // ascending
                });
                return copy;
            }, [filtered, xAxis]);

            // Build a stable key for row matching using numeric x/y with rounding
            const makeKey = (x, y) => {
                if (x == null || y == null) return null;
                const rx = Number(x).toFixed(6);
                const ry = Number(y).toFixed(6);
                return `${rx}|${ry}`;
            };
            const selectedKey = useMemo(() => makeKey(selectedPoint?.x, selectedPoint?.y), [selectedPoint, xAxis, yAxis]);

            // Scroll to selected row when it changes
            useEffect(() => {
                if (!selectedKey) return;
                const idx = sortedRows.findIndex(r => makeKey(r[xAxis], r[yAxis]) === selectedKey);
                if (idx >= 0) {
                    const el = document.getElementById(`row-${idx}`);
                    if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
                }
            }, [selectedKey, sortedRows, xAxis, yAxis]);

            function copy(text, el) {
                navigator.clipboard.writeText(text).then(() => {
                    if (!el) return;
                    const prev = el.innerHTML;
                    el.innerHTML = '<span class="text-green-600">✓ Copied!</span>';
                    setTimeout(() => el.innerHTML = prev, 900);
                });
            }

            return React.createElement('div', { className: 'mt-4 overflow-x-auto max-w-full' }, [
                React.createElement('table', { key: 't', className: 'min-w-full text-sm border border-slate-200 rounded-lg overflow-hidden' }, [
                    React.createElement('thead', { key: 'h' }, [
                        React.createElement('tr', { key: 'r' }, orderedFields.map(f => (
                            React.createElement('th', { key: f, className: 'text-white px-3 py-2 text-left text-xs font-semibold whitespace-nowrap', style: { background: '#67a5a1 70%' } }, getAxisLabel(f))
                        )))
                    ]),
                    React.createElement('tbody', { key: 'b' }, sortedRows.map((row, idx) => (
                        React.createElement('tr', { key: idx, id: `row-${idx}`, className: (selectedKey && makeKey(row[xAxis], row[yAxis]) === selectedKey ? 'bg-teal-100 transition-colors' : 'odd:bg-white even:bg-slate-50 transition-colors') }, orderedFields.map(f => {
                            // Get value using nested data access for all fields
                            const value = getNestedValue(row._original || row, f);
                            if (f === 'cmd') {
                                return React.createElement('td', { key: f, className: 'px-3 py-2 border-b border-slate-100 max-w-xs' }, (
                                    React.createElement('div', { className: 'flex items-start justify-between cursor-pointer px-3 py-2 bg-slate-50 hover:bg-indigo-50 rounded-md border border-slate-200', onClick: (e) => copy(String(value), e.currentTarget), title: 'Click to copy' }, [
                                        React.createElement('span', { key: 't', className: 'font-mono text-xs text-slate-700 break-words flex-1 leading-relaxed' }, String(value)),
                                        React.createElement(Copy, { key: 'i', size: 14, className: 'text-slate-500 ml-2 shrink-0 mt-0.5' })
                                    ])
                                ));
                            }
                            return React.createElement('td', { key: f, className: 'px-3 py-2 border-b border-slate-100 whitespace-nowrap' }, typeof value === 'number' ? value.toFixed(2) : (value ?? ''));
                        }))
                    )))
                ])
            ]);
        }

        function App() {
            const [xAxis, setXAxis] = useState(defaults?.xAxis || 'mean_e2e_latency_ms');
            const [yAxis, setYAxis] = useState(defaults?.yAxis || 'output_throughput');
            const [showLines, setShowLines] = useState(defaults?.showLines ?? true);
            const [showPoints, setShowPoints] = useState(defaults?.showPoints ?? true);
            const [selectedPoint, setSelectedPoint] = useState(null);

            // Custom constraints state management
            const [customConstraints, setCustomConstraints] = useState(() => {
                try {
                    const saved = localStorage.getItem('llm-optimizer-custom-constraints');
                    return saved ? JSON.parse(saved) : [];
                } catch (e) {
                    return [];
                }
            });
            const [showAddForm, setShowAddForm] = useState(false);

            // Track which original constraints are disabled
            const [disabledOriginalConstraints, setDisabledOriginalConstraints] = useState(() => {
                try {
                    const saved = localStorage.getItem('llm-optimizer-disabled-constraints');
                    return saved ? JSON.parse(saved) : [];
                } catch (e) {
                    return [];
                }
            });

            // Save to localStorage whenever customConstraints change
            useEffect(() => {
                try {
                    localStorage.setItem('llm-optimizer-custom-constraints', JSON.stringify(customConstraints));
                } catch (e) {
                    console.warn('Failed to save constraints to localStorage:', e);
                }
            }, [customConstraints]);

            // Save to localStorage whenever disabledOriginalConstraints change
            useEffect(() => {
                try {
                    localStorage.setItem('llm-optimizer-disabled-constraints', JSON.stringify(disabledOriginalConstraints));
                } catch (e) {
                    console.warn('Failed to save disabled constraints to localStorage:', e);
                }
            }, [disabledOriginalConstraints]);

            // Merge original and custom constraints, excluding disabled ones
            const effectiveConstraints = useMemo(() => {
                const original = constraints || [];
                const custom = customConstraints || [];

                // Filter out disabled original constraints
                let enabledOriginal = [];
                if (Array.isArray(original)) {
                    enabledOriginal = original.filter((constraint, index) =>
                        !disabledOriginalConstraints.includes(index)
                    );
                } else if (original && !disabledOriginalConstraints.includes(0)) {
                    enabledOriginal = [original];
                }

                return [...enabledOriginal, ...custom];
            }, [customConstraints, disabledOriginalConstraints]);

            const dataset = useTransformedData(data, xAxis, yAxis);

            return React.createElement('div', { className: 'flex flex-col w-screen min-h-screen' }, [
                // Header
                React.createElement('header', { key: 'top', className: 'bg-transparent text-slate-900' }, [
                    React.createElement('div', { key: 'container', className: 'max-w-[1400px] mx-auto w-full px-5 py-6' }, [
                        React.createElement('div', { key: 'titleWrap', className: 'w-full flex flex-col items-center justify-center gap-4' }, [
                            React.createElement('div', { key: 'title', className: 'text-2xl md:text-3xl font-bold tracking-tight' }, 'LLM Optimizer')
                        ])
                    ])
                ]),

                // Main
                React.createElement('main', { key: 'm', className: 'flex-1 overflow-visible max-w-full' }, [
                    React.createElement('div', { key: 'container', className: 'max-w-[1400px] mx-auto w-full p-5 flex flex-col gap-4' }, [
                        // Configuration Section
                        React.createElement('section', { key: 'config', className: 'rounded-xl border border-slate-200 bg-white p-4' }, [
                            React.createElement(Controls, { key: 'ctrl', showLines, showPoints, fieldOptions, customConstraints, setCustomConstraints, showAddForm, setShowAddForm, disabledOriginalConstraints, setDisabledOriginalConstraints, onChange: (c) => { if (c.showLines !== undefined) setShowLines(c.showLines); if (c.showPoints !== undefined) setShowPoints(c.showPoints); }, metadata })
                        ]),

                        // Chart Section
                        React.createElement('section', { key: 'chart', className: 'rounded-xl border border-slate-200 bg-white p-4' }, [
                            React.createElement('div', { key: 'chartWrap', className: 'w-full relative' }, [
                                // Compact controls positioned over chart
                                React.createElement('div', { key: 'chartControls', className: 'absolute top-2 left-2 right-2 z-10 flex justify-between items-center' }, [
                                    React.createElement('div', { key: 'axisSelectors', className: 'flex gap-3 items-center text-sm bg-white/90 backdrop-blur-sm rounded px-2 py-1 border border-slate-200' }, [
                                        React.createElement('div', { key: 'x', className: 'flex items-center gap-1' }, [
                                            React.createElement('label', { className: 'text-xs font-medium text-slate-600' }, 'X-axis:'),
                                            React.createElement('select', { value: xAxis, onChange: e => setXAxis(e.target.value), className: 'text-xs px-1 py-0.5 rounded border border-slate-300 bg-white' }, createSelectOptions('xAxis', fieldOptions))
                                        ]),
                                        React.createElement('div', { key: 'y', className: 'flex items-center gap-1' }, [
                                            React.createElement('label', { className: 'text-xs font-medium text-slate-600' }, 'Y-axis:'),
                                            React.createElement('select', { value: yAxis, onChange: e => setYAxis(e.target.value), className: 'text-xs px-1 py-0.5 rounded border border-slate-300 bg-white' }, createSelectOptions('yAxis', fieldOptions))
                                        ])
                                    ]),
                                    React.createElement('div', { key: 'legendExplanation', className: 'flex items-center gap-3 text-xs text-slate-600 bg-white/90 backdrop-blur-sm rounded px-2 py-1 border border-slate-200', title: 'Pareto points lie on the frontier where no point can improve one objective without worsening the other.' }, [
                                        React.createElement('div', { key: 'lg1', className: 'flex items-center gap-1' }, [
                                            React.createElement('span', { key: 'dot1', className: 'inline-block w-2 h-2 rotate-45', style: { backgroundColor: '#94a3b8', border: '1px solid #334155' } }),
                                            React.createElement('span', { key: 'txt1' }, 'Diamond: Pareto')
                                        ]),
                                        React.createElement('div', { key: 'lg2', className: 'flex items-center gap-1' }, [
                                            React.createElement('span', { key: 'dot2', className: 'inline-block text-sm leading-none text-slate-500' }, '★'),
                                            React.createElement('span', { key: 'txt2' }, 'Star: Pareto + constraints')
                                        ]),
                                        React.createElement('div', { key: 'lg3', className: 'flex items-center gap-1' }, [
                                            React.createElement('span', { key: 'dot3', className: 'inline-block w-2 h-2 rounded-full', style: { backgroundColor: '#94a3b8' } }),
                                            React.createElement('span', { key: 'txt3' }, 'Circle: Other')
                                        ])
                                    ])
                                ]),
                                React.createElement(Chart, { key: 'c', dataset, xAxis, yAxis, showLines, showPoints, constraints: effectiveConstraints, onSelect: (pt) => setSelectedPoint(pt) })
                            ])
                        ]),
                        React.createElement('section', { key: 'best', className: 'rounded-xl border border-slate-200 bg-white p-4' }, [
                            React.createElement('h2', { key: 'title', className: 'text-sm font-semibold mb-2' }, 'Best Configuration'),
                            React.createElement('div', { key: 'config', className: 'space-y-3' }, (() => {
                                // Determine if we have any active constraints (benchmark + custom)
                                const hasActiveConstraints = effectiveConstraints && effectiveConstraints.length > 0;

                                // Determine which throughput type to show based on Y-axis
                                const isInputThroughput = yAxis === 'input_throughput';
                                const throughputField = isInputThroughput ? 'input_throughput' : 'output_throughput';

                                // Calculate best configuration dynamically based on current constraints
                                // Use original data, not transformed data
                                const selectedConfig = calculateBestConfig(data, effectiveConstraints, throughputField);

                                if (!selectedConfig) {
                                    return React.createElement('div', { className: 'text-sm text-slate-500' }, 'No valid configuration found');
                                }

                                const throughputType = isInputThroughput ? 'Input Throughput' : 'Output Throughput';
                                const constraintLabel = hasActiveConstraints ? 'With Constraints' : 'Unconstrained';

                                return React.createElement('div', { key: 'single-config' }, [
                                    React.createElement('div', { key: 'config-card', className: 'border border-slate-200 rounded-lg p-3' }, [
                                        React.createElement('div', { key: 'details', className: 'flex justify-between items-center text-xs text-slate-600 mb-2' }, [
                                            React.createElement('span', { key: 'throughput', className: 'font-medium' }, `${throughputType}: ${(selectedConfig.throughput || 0).toFixed(1)} tok/s`),
                                            React.createElement('span', { key: 'config-details' }, (() => {
                                                const parts = [];

                                                // Get client args from nested data
                                                const originalData = selectedConfig.originalData;
                                                const requestRate = originalData?.config?.client_args?.request_rate;
                                                const maxConcurrency = originalData?.config?.client_args?.max_concurrency;

                                                // Get server args directly from config
                                                const serverArgs = selectedConfig.config?.server_args || {};

                                                // Add constraint label first
                                                const combinedParts = [constraintLabel];

                                                // Add client args
                                                if (maxConcurrency !== undefined) {
                                                    combinedParts.push(`max_concurrency: ${maxConcurrency}`);
                                                }

                                                if (requestRate !== undefined && requestRate !== Infinity) {
                                                    combinedParts.push(`request_rate: ${requestRate}`);
                                                }

                                                // Don't add server args to Unconstrained section

                                                return combinedParts.join(' • ');
                                            })())
                                        ]),
                                        selectedConfig.cmd && React.createElement('div', { key: 'cmd-wrapper', className: 'relative' }, [
                                            React.createElement('pre', { key: 'cmd', className: 'p-2 bg-slate-50 rounded text-xs overflow-x-auto' },
                                                React.createElement('code', {}, selectedConfig.cmd)
                                            ),
                                            React.createElement('button', {
                                                key: 'copy',
                                                className: 'absolute top-1 right-1 p-1 rounded hover:bg-slate-200',
                                                onClick: () => navigator.clipboard.writeText(selectedConfig.cmd),
                                                title: 'Copy to clipboard'
                                            }, React.createElement(Copy, { size: 12 }))
                                        ])
                                    ])
                                ]);
                            })())
                        ]),
                        React.createElement('div', { key: 'tableWrap', className: 'overflow-visible' }, [
                            React.createElement('div', { key: 'tableScroller', className: 'overflow-visible' }, [
                                React.createElement(DataTable, { key: 'tbl', dataset, onlyPareto: true, xAxis, yAxis, selectedPoint })
                            ])
                        ])
                    ])
                ])
            ]);
        }

        createRoot(document.getElementById('root')).render(React.createElement(App));
    </script>
</body>
</html>
